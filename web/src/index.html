  THESIS: Every state is a sign. Worktime reads like station signage — one system, legible at ten metres,
  never ambiguous — instead of the category's sidebar + KPI cards + indigo table.
  OWN-WORLD: Cool ground #f2f3f1, ink #15181c, 1px rules. Colour only on flat enamel plates (2px corners,
  uppercase, tracked): yellow pending, orange revision, green approved/working, red rejected/punch-out,
  information blue for navigation and focus. Overpass (Highway Gothic lineage), tabular numerals,
  authored 2px square-cap pictograms. A station clock with a red second hand.
  STORY: A worker sees at once whether they are on the clock and what each log's state is and why; a
  supervisor sees who is working now and decides without double-deciding; an admin governs who can do what.
  FIRST VIEWPORT: "Hoy" — station clock left (about 40% width on desktop, top on mobile) with the punch
  action as one large plate under it and the "Trabajando desde 08:12" sign; right, the day as a 24 h track
  where each log's length is its duration, then today's logs as signed rows. Header band in ink with the
  wordmark, signed nav tabs, connection plate.
  FORM: Station wayfinding signage (SBB/Aicher programme), candidate 6 of 7; seed key eb5836bc.
  Raises: duration-is-length (Labanotation), range header (lexicon), whole-cell roster (catalog), nothing labelled twice (Saville).
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
