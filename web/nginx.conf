# Round-robin across the API replicas, no sticky sessions: SignalR uses WebSockets only (skipNegotiation),
# and the Redis backplane delivers every event to every replica.
upstream api {
    server api-1:8080;
    server api-2:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# First visit: pick the build matching the browser language.
map $http_accept_language $preferred_locale {
    default es;
    ~^en    en;
}

server {
    listen 80;
    server_tokens off;
    absolute_redirect off; # keep the host's port (8080) in redirects

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;
    }

    location /hubs/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://api;
    }

    location /es/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /es/index.html;
    }

    location /en/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /en/index.html;
    }

    location = / {
        return 302 /$preferred_locale/;
    }

    location / {
        return 302 /$preferred_locale$request_uri;
    }
}
